<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Explorer 🌈 สมุดผจญภัยภาษาอังกฤษ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Prompt:wght@400;500;600;700&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FF8FC7; --pink-soft:#FFE0F0; --lav:#B7A6FF; --lav-soft:#EDE6FF;
  --mint:#63D9B7; --mint-soft:#DEFCF1; --sky:#63C4FF; --sky-soft:#E0F4FF;
  --sun:#FFC94A; --sun-soft:#FFF3D1; --coral:#FF7A7A; --coral-soft:#FFE3E3;
  --ink:#4A3B63; --ink-soft:#8A7A9E; --paper:#FFF9F4; --card:#FFFFFF;
  --shadow: 0 6px 0 rgba(74,59,99,0.15);
  --radius: 22px;
  --font-display:'Baloo 2', 'Mali', sans-serif;
  --font-body:'Prompt','Mali', sans-serif;
}
body.theme-dark{
  --pink:#FF8FC7; --pink-soft:#3A2540; --lav:#B7A6FF; --lav-soft:#2C2650;
  --mint:#63D9B7; --mint-soft:#1B3A34; --sky:#63C4FF; --sky-soft:#1B2E42;
  --sun:#FFC94A; --sun-soft:#3A3018; --coral:#FF7A7A; --coral-soft:#3A2222;
  --ink:#F1E9FA; --ink-soft:#B8ACC9; --paper:#181425; --card:#241D36;
  --shadow: 0 6px 0 rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(160deg, var(--sky-soft) 0%, var(--pink-soft) 45%, var(--sun-soft) 100%);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition: background .3s ease, color .3s ease;
}
body.theme-dark{ background: linear-gradient(160deg, #181425 0%, #201a30 50%, #1c1730 100%); }
body.theme-dark .index-card, body.theme-dark .form-card, body.theme-dark .sub-card,
body.theme-dark .question-block, body.theme-dark .manage-row, body.theme-dark .vocab-card,
body.theme-dark .stat-card, body.theme-dark .route-card, body.theme-dark .gate-card,
body.theme-dark .result-card, body.theme-dark .game-setup, body.theme-dark .fill-input,
body.theme-dark .search-row, body.theme-dark input, body.theme-dark select, body.theme-dark textarea,
body.theme-dark .choice-btn, body.theme-dark .match-item, body.theme-dark .memory-card.flipped,
body.theme-dark .flip-front{ color: var(--ink); }
body.theme-dark input, body.theme-dark select, body.theme-dark textarea{ background: #2A2340; }
body.theme-dark .choice-btn, body.theme-dark .match-item{ background:#2A2340; }
body.theme-dark #topbar{ background: rgba(24,20,37,0.8); }
body.theme-dark .tab-btn{ background:#2A2340; }
body.theme-dark .key-btn{ background:#2A2340; color:var(--ink); }
#app{max-width:900px;margin:0 auto;min-height:100vh;position:relative;}
.blob{position:fixed;border-radius:50%;filter:blur(2px);opacity:0.35;z-index:0;pointer-events:none;}
h1,h2,h3{font-family:var(--font-display);}
::selection{background:var(--pink);color:white;}

/* topbar: full width, sticky, content centered inside via inner wrapper */
#topbar{
  width:100%;background:rgba(255,255,255,0.75);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:20;border-bottom:3px dashed var(--pink);
  box-sizing:border-box;
}
.topbar-inner{
  max-width:900px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:14px 20px;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--ink);}
.brand-mark{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow);
  animation:wiggle 4s ease-in-out infinite;
}
@keyframes wiggle{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;}
.tab-btn{
  display:flex;align-items:center;gap:7px;padding:12px 20px;border-radius:999px;
  background:white;color:var(--ink-soft);border:2px solid transparent;
  font-family:var(--font-body);font-weight:700;font-size:15px;cursor:pointer;
  box-shadow:0 3px 0 rgba(74,59,99,0.1);transition:transform .12s ease;
}
.tab-btn:hover{transform:translateY(-2px);}
.tab-btn.active{background:linear-gradient(135deg,var(--pink),var(--coral));color:white;box-shadow:0 4px 0 rgba(255,122,122,0.4);}

#main{padding:10px 6px 60px;position:relative;z-index:1;}
.page{max-width:800px;margin:0 auto;padding:22px 16px;}

.back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;padding:6px 0;margin-bottom:10px;}
.back-link:hover{color:var(--pink);}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;
  font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer;border:none;
  position:relative;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(2px) scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--coral));color:white;box-shadow:0 4px 0 #d65a7a;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;}
.btn-mint{background:linear-gradient(135deg,var(--mint),#3fc79e);color:white;box-shadow:0 4px 0 #2ea885;}
.btn-lav{background:linear-gradient(135deg,var(--lav),#9179ff);color:white;box-shadow:0 4px 0 #6f56e0;}
.btn-ghost{background:white;color:var(--ink);box-shadow:0 3px 0 rgba(74,59,99,0.15);}
.btn-ghost:hover{background:var(--pink-soft);}
.btn-danger{background:linear-gradient(135deg,var(--coral),#e14b4b);color:white;box-shadow:0 4px 0 #b83838;}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:999px;}
.btn-block{width:100%;justify-content:center;}

/* hero */
.hero{text-align:center;padding:24px 10px 10px;}
.hero-mascot{font-size:56px;display:inline-block;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-10px) rotate(4deg);}}
.eyebrow{font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lav);margin:8px 0 4px;}
.hero-title{font-size:44px;font-weight:800;margin:0 0 12px;background:linear-gradient(135deg,var(--pink),var(--lav),var(--sky));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{max-width:520px;margin:0 auto 20px;color:var(--ink-soft);font-size:15px;line-height:1.7;}
.hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.stat-row{display:flex;gap:12px;margin:16px 0 30px;flex-wrap:wrap;justify-content:center;}
.stat-card{background:var(--card);border-radius:18px;padding:16px 22px;text-align:center;min-width:110px;box-shadow:var(--shadow);border:2px solid var(--pink-soft);}
.stat-num{display:block;font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--pink);}
.stat-label{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;font-weight:600;}

.section-block{margin-top:26px;}
.section-kicker{font-family:var(--font-body);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--lav);margin-bottom:12px;}
.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.route-card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);border:2px dashed var(--sky);}
.route-card h3{margin:8px 0 4px;font-size:18px;}
.route-card p{margin:0;color:var(--ink-soft);font-size:13px;}
.grade-strip{display:flex;gap:8px;flex-wrap:wrap;}
.grade-chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:2px solid var(--sun);border-radius:16px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:12.5px;box-shadow:0 3px 0 rgba(255,201,74,.3);}
.grade-chip-num{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--sun);}

.page-title{font-size:28px;margin:0 0 14px;font-weight:800;}
.filter-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.filter-chip{padding:8px 15px;border-radius:999px;border:2px solid var(--pink-soft);background:white;color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;}
.filter-chip.active{background:linear-gradient(135deg,var(--lav),#9179ff);color:white;border-color:transparent;}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:560px){.card-grid{grid-template-columns:1fr;}.route-grid{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr!important;}.match-wrap{flex-direction:column;}}

.index-card{
  text-align:left;background:var(--card);border-radius:20px;padding:18px;cursor:pointer;position:relative;
  box-shadow:var(--shadow);border:3px solid var(--pink-soft);transform:rotate(var(--tilt,0deg));
  transition:transform .15s ease, box-shadow .15s ease;
}
.index-card:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 10px 0 rgba(74,59,99,0.12);}
.index-card h3{font-size:17px;margin:0 0 6px;}
.index-card p{font-size:13px;color:var(--ink-soft);margin:0 0 10px;line-height:1.5;}
.card-cta{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:800;color:var(--pink);}
.index-card-top{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.game-card-active{border-color:var(--pink);}

.stamp{font-family:var(--font-body);font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;color:white;}
.stamp-navy{background:var(--lav);}
.stamp-sage{background:var(--mint);}
.stamp-red{background:var(--coral);}
.stamp-mustard{background:var(--sun);color:var(--ink);}

.lesson-head{margin-bottom:10px;}
.lesson-summary{color:var(--ink-soft);font-size:14px;}
.notebook-block{background:var(--card);border-left:6px solid var(--mint);border-radius:14px;padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
.notebook-block h4{margin:0 0 8px;font-size:15px;}
.notebook-block p{margin:0;font-size:14px;line-height:1.7;color:var(--ink);}
.example-block{margin-top:20px;}
.example-block h4{font-size:16px;margin-bottom:10px;}
.example-row{background:var(--sky-soft);border-radius:14px;padding:10px 14px;margin-bottom:8px;}
.example-en{margin:0 0 3px;font-style:italic;font-weight:700;}
.example-th{margin:0;font-size:13px;color:var(--ink-soft);}
.related-quiz-block{margin-top:26px;padding-top:16px;border-top:3px dashed var(--pink-soft);}
.related-quiz-block h4{font-size:15px;margin-bottom:10px;}
.related-quiz-list{display:flex;gap:10px;flex-wrap:wrap;}
.empty-note{color:var(--ink-soft);font-size:14px;grid-column:1/-1;}

.question-block{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:2px solid var(--lav-soft);}
.question-num{font-size:11px;font-weight:700;color:var(--pink);margin:0 0 6px;text-transform:uppercase;}
.question-text{font-size:15px;font-weight:700;margin:0 0 12px;}
.choice-list{display:flex;flex-direction:column;gap:8px;}
.choice-btn{text-align:left;padding:11px 15px;border-radius:14px;border:2px solid var(--pink-soft);background:white;cursor:pointer;font-family:var(--font-body);font-size:14px;font-weight:600;}
.choice-btn.active{border-color:var(--pink);background:var(--pink-soft);}
.choice-btn.wrong-choice{border-color:var(--coral);background:var(--coral-soft);}
.fill-input,.name-field input,.search-input,.form-card input,.form-card select,.form-card textarea{
  width:100%;padding:11px 15px;border-radius:14px;border:2px solid var(--lav-soft);font-family:var(--font-body);font-size:14px;background:white;
}
.fill-input:focus,.form-card input:focus,.form-card select:focus,.form-card textarea:focus{outline:none;border-color:var(--pink);}
.name-field{margin-bottom:20px;}
.name-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}

.match-wrap{display:flex;gap:14px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
.match-item{padding:10px 12px;border-radius:14px;border:2px solid var(--lav-soft);background:white;font-size:13.5px;font-weight:600;cursor:pointer;text-align:center;}
.match-item.sel{border-color:var(--sun);background:var(--sun-soft);}
.match-item.done{border-color:var(--mint);background:var(--mint-soft);color:#1c8a68;cursor:default;}
.match-item.corr{border-color:var(--mint);background:var(--mint-soft);}
.match-item.wrong{border-color:var(--coral);background:var(--coral-soft);color:#c23a3a;}

.result-card{text-align:center;background:var(--card);border-radius:24px;padding:40px 24px;border:4px dashed var(--pink);box-shadow:var(--shadow);}
.result-card h2{margin:12px 0 6px;}
.result-score{font-size:44px;font-weight:800;margin:6px 0 0;color:var(--pink);font-family:var(--font-display);}
.result-pct{color:var(--ink-soft);margin:0;font-weight:600;}

.answerkey-block{margin-top:22px;}
.answerkey-row{border-radius:16px;padding:14px 16px;margin-bottom:12px;border:3px solid;}
.ak-correct{border-color:var(--mint);background:var(--mint-soft);}
.ak-wrong{border-color:var(--coral);background:var(--coral-soft);}
.ak-head{display:flex;align-items:flex-start;gap:8px;font-weight:700;margin-bottom:8px;}
.ak-head p{margin:0;}
.ak-choices{margin:0 0 6px;padding-left:20px;font-size:13.5px;}
.ak-choice-correct{color:#1c8a68;font-weight:800;}
.ak-choice-wrong{color:#c23a3a;}
.ak-fill-line{font-size:13.5px;margin:3px 0;}
.ak-explain{font-size:13px;color:var(--ink-soft);margin:8px 0 0;padding-top:8px;border-top:2px dashed rgba(74,59,99,0.15);}

.gate-card{max-width:360px;margin:40px auto;text-align:center;background:var(--card);border:4px dashed var(--lav);border-radius:24px;padding:30px 24px;box-shadow:var(--shadow);}
.gate-card h2{margin:10px 0 4px;}
.gate-card p{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
.gate-card input{width:100%;margin-bottom:12px;}
.gate-error{color:var(--coral);font-size:12.5px;margin-top:10px;font-weight:700;}
.gate-hint{font-size:11px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}

.form-card{background:var(--card);border-radius:20px;padding:20px;margin:14px 0;box-shadow:var(--shadow);border:2px solid var(--lav-soft);}
.form-card h3{margin:0 0 14px;}
.form-card label{display:block;font-size:12px;color:var(--ink-soft);margin:12px 0 5px;font-weight:700;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sub-card{background:var(--pink-soft);border-radius:16px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px;}
.mc-row{display:flex;align-items:center;gap:8px;}
.mini-hint{font-size:11.5px;color:var(--ink-soft);margin:2px 0 0;}

.btn-mini{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;border:none;background:var(--lav-soft);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;margin-right:8px;margin-top:6px;}
.btn-mini-danger{background:var(--coral-soft);color:#c23a3a;}

.manage-list{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
.manage-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;gap:10px;flex-wrap:wrap;box-shadow:0 3px 0 rgba(74,59,99,0.08);}
.manage-title{margin:0;font-weight:700;font-size:14px;}
.manage-sub{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}
.manage-actions{display:flex;gap:6px;}

.result-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
.result-table th{text-align:left;color:var(--ink-soft);font-weight:700;font-size:11.5px;text-transform:uppercase;padding:4px 6px;}
.result-table td{padding:6px;border-top:1px solid rgba(74,59,99,0.1);}

.search-row{display:flex;align-items:center;gap:8px;background:white;border-radius:14px;padding:4px 12px;border:2px solid var(--lav-soft);}
.search-row .search-input{border:none;padding:9px 0;}
.search-row .search-input:focus{outline:none;}

.vocab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (max-width:560px){.vocab-grid{grid-template-columns:1fr;}}
.vocab-card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border:2px solid var(--sun-soft);}
.vocab-word{font-family:var(--font-display);font-weight:800;font-size:17px;margin:0 0 2px;color:var(--ink);}
.vocab-read{font-size:12px;color:var(--pink);font-weight:700;margin:0 0 4px;}
.vocab-pos{font-size:10px;color:var(--mint-soft);background:var(--mint);padding:2px 8px;border-radius:999px;font-weight:700;}
.vocab-meaning{margin:6px 0 0;font-size:13.5px;color:var(--ink-soft);}

.game-setup{margin-top:24px;background:var(--card);border:3px dashed var(--sky);border-radius:20px;padding:18px;}
.game-play{max-width:640px;margin:0 auto;}
.game-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13.5px;font-weight:600;flex-wrap:wrap;gap:8px;}

.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:480px){.memory-grid{grid-template-columns:repeat(3,1fr);}}
.memory-card{aspect-ratio:1;border-radius:14px;border:none;background:linear-gradient(135deg,var(--lav),#9179ff);color:white;font-size:11px;font-weight:700;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;word-break:break-word;box-shadow:0 3px 0 #6f56e0;}
.memory-card.matched{background:var(--mint);opacity:.65;cursor:default;box-shadow:none;}
.memory-card.flipped{background:white;color:var(--ink);border:2px solid var(--sun);}

.scramble-box{background:var(--card);border-radius:20px;padding:24px;text-align:center;box-shadow:var(--shadow);}
.scramble-letters{font-family:var(--font-display);font-size:36px;letter-spacing:.15em;margin:0 0 10px;font-weight:800;color:var(--lav);}
.feedback-box{margin-top:14px;padding:12px;border-radius:14px;font-weight:800;}
.fb-correct{background:var(--mint-soft);color:#1c8a68;}
.fb-wrong{background:var(--coral-soft);color:#c23a3a;}

.timer-bar{height:10px;background:var(--pink-soft);border-radius:999px;overflow:hidden;}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));transition:width 1s linear;}

.hangman-word{font-family:var(--font-display);font-size:32px;text-align:center;letter-spacing:.2em;margin:16px 0;font-weight:800;}
.hangman-keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
@media (max-width:480px){.hangman-keyboard{grid-template-columns:repeat(6,1fr);}}
.key-btn{padding:9px 0;border-radius:10px;border:none;background:white;box-shadow:0 3px 0 rgba(74,59,99,0.15);text-transform:uppercase;cursor:pointer;font-weight:700;}
.key-btn.correct{background:var(--mint-soft);box-shadow:0 3px 0 #2ea885;}
.key-btn.wrong{background:var(--coral-soft);box-shadow:0 3px 0 #b83838;}
.key-btn:disabled{opacity:.5;cursor:default;}

.flip-card{perspective:1000px;height:180px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flip-inner.flipped{transform:rotateY(180deg);}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:20px;font-family:var(--font-display);font-size:22px;font-weight:800;text-align:center;padding:12px;box-shadow:var(--shadow);}
.flip-front{background:white;color:var(--ink);border:3px solid var(--pink);}
.flip-back{background:linear-gradient(135deg,var(--lav),#9179ff);color:white;transform:rotateY(180deg);font-size:16px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,0.2);animation:toast-in .3s ease;}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
.confetti-piece{position:fixed;top:-30px;font-size:22px;z-index:200;animation:confetti-fall 2.2s ease-in forwards;pointer-events:none;}
@keyframes confetti-fall{to{transform:translateY(110vh) rotate(600deg);opacity:0.2;}}

.spin{font-size:34px;animation:spin 1.2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.theme-toggle{background:white;border:none;border-radius:999px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(74,59,99,0.15);}

.quote-th{font-size:13.5px;color:var(--ink-soft);margin:0;}

.auth-card{max-width:380px;margin:20px auto;background:var(--card);border-radius:24px;padding:26px 24px;box-shadow:var(--shadow);border:3px solid var(--lav-soft);}
.auth-card h2{margin:6px 0 4px;text-align:center;}
.auth-card p.sub{text-align:center;color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--pink-soft);border-radius:999px;padding:4px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:999px;border:none;background:transparent;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);}
.auth-tab.active{background:var(--card);color:var(--ink);box-shadow:0 2px 0 rgba(74,59,99,.1);}
.auth-error{color:var(--coral);font-size:12.5px;font-weight:700;margin-top:8px;text-align:center;}

.account-header{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px;flex-wrap:wrap;}
.account-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.account-name{font-weight:800;font-size:18px;margin:0;}
.account-sub{color:var(--ink-soft);font-size:12.5px;margin:2px 0 0;}

.pie-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center;margin:16px 0;}
.pie-chart{width:180px;height:180px;border-radius:50%;flex-shrink:0;box-shadow:var(--shadow);}
.pie-legend{display:flex;flex-direction:column;gap:8px;min-width:180px;}
.pie-legend-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.pie-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.pie-legend-label{flex:1;font-weight:600;}
.pie-legend-pct{font-weight:800;font-family:var(--font-display);}
.strength-bar-track{background:var(--pink-soft);border-radius:999px;height:10px;overflow:hidden;margin-top:4px;}
.strength-bar-fill{height:100%;border-radius:999px;}

/* single theme-cycle button: light -> dark -> auto-rotating season (every 2 min) -> light ... */
.theme-cycle-btn{background:white;border:none;border-radius:999px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 3px 0 rgba(74,59,99,0.15);transition:transform .15s ease;}
.theme-cycle-btn:active{transform:scale(0.92);}
.theme-mode-label{font-size:10px;font-weight:700;color:var(--ink-soft);text-align:center;margin-top:2px;white-space:nowrap;}
.theme-cycle-wrap{display:flex;flex-direction:column;align-items:center;}

/* ============================================================
   English Explorer — สมุดผจญภัยภาษาอังกฤษ (Static single-file build)
   ทำงานได้ทันทีบน GitHub Pages หรือเปิดไฟล์ตรง ๆ ในเบราว์เซอร์
   ข้อมูลเก็บใน localStorage ของเบราว์เซอร์แต่ละเครื่อง (ไม่มีเซิร์ฟเวอร์กลาง)
   ใช้ปุ่ม "ส่งออกข้อมูล" / "นำเข้าข้อมูล" ในหลังบ้านครู เพื่อย้าย/แชร์ข้อมูลระหว่างเครื่อง
============================================================ */

const TEACHER_PASSCODE = "ratsada2569";
const LEVELS = ["ม.ต้น","ม.ปลาย"];
const CATEGORIES = ["Grammar","Vocabulary"];
const GRADES = ["ม.1","ม.2","ม.3","ม.4","ม.5","ม.6"];
const POS_LABEL = {n:"คำนาม",v:"คำกริยา",adj:"คำคุณศัพท์",adv:"คำวิเศษณ์",phr:"คำเชื่อม/วลี"};

function genId(p){ return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.from(document.querySelectorAll(sel)); }

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2200);
}
function confettiBurst(count){
  count = count || 24;
  const emojis = ["🎉","✨","🌸","⭐","🎊","💖","🌟"];
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100+"vw";
    el.style.animationDelay = (Math.random()*0.4)+"s";
    el.style.fontSize = (16+Math.random()*16)+"px";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }
}
/* ---------------------------- Theme (light / dark / auto-rotating season) ---------------------------- */
const SEASON_THEMES = [
  { id:"spring", label:"ฤดูใบไม้ผลิ", icon:"🌸" },
  { id:"summer", label:"ฤดูร้อน", icon:"🌞" },
  { id:"autumn", label:"ฤดูใบไม้ร่วง", icon:"🍂" },
  { id:"winter", label:"ฤดูหนาว", icon:"❄️" },
  { id:"cartoon", label:"ลายการ์ตูน", icon:"🎪" },
  { id:"nature", label:"ลายธรรมชาติ", icon:"🌿" },
  { id:"ocean", label:"ลายทะเล", icon:"🌊" },
  { id:"forest", label:"ลายป่า", icon:"🌲" },
];
const SEASON_ROTATE_MS = 2 * 60 * 1000; // rotate every 2 minutes
const ALL_THEME_CLASS_IDS = ["dark"].concat(SEASON_THEMES.map(t=>t.id));
function applyThemeClass(id){
  ALL_THEME_CLASS_IDS.forEach(t => document.body.classList.remove("theme-"+t));
  if (id !== "light") document.body.classList.add("theme-"+id);
}
let themeMode = "light"; // "light" | "dark" | "season"
let seasonIndex = 0;
let seasonTimerId = null;

function applyCurrentVisual(){
  if (themeMode === "light") applyThemeClass("light");
  else if (themeMode === "dark") applyThemeClass("dark");
  else applyThemeClass(SEASON_THEMES[seasonIndex].id);
}
function stopSeasonRotation(){ if (seasonTimerId) { clearInterval(seasonTimerId); seasonTimerId = null; } }
function startSeasonRotation(){
  stopSeasonRotation();
  seasonTimerId = setInterval(() => {
    seasonIndex = (seasonIndex + 1) % SEASON_THEMES.length;
    localStorage.setItem("ee_season_index", String(seasonIndex));
    applyCurrentVisual();
    renderTopbar();
  }, SEASON_ROTATE_MS);
}
function initTheme(){
  themeMode = localStorage.getItem("ee_theme_mode") || "light";
  seasonIndex = parseInt(localStorage.getItem("ee_season_index") || "0", 10) || 0;
  applyCurrentVisual();
  if (themeMode === "season") startSeasonRotation();
}

function dayOfYear(){
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const diff = now - start;
  return Math.floor(diff / (1000*60*60*24));
}
function quoteOfTheDay(){ return QUOTES[dayOfYear() % QUOTES.length]; }

/* ---------------------------- Local accounts, login, streaks ---------------------------- */

function loadUsers(){ return loadJSONsafe("ee_users", []); }
function saveUsers(u){ try{ localStorage.setItem("ee_users", JSON.stringify(u)); }catch(e){ console.error(e); } }
function loadJSONsafe(key, fallback){ try{ const raw = localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){} return fallback; }
function getCurrentUsername(){ return localStorage.getItem("ee_current_user") || null; }
function setCurrentUsername(u){ if(u) localStorage.setItem("ee_current_user", u); else localStorage.removeItem("ee_current_user"); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function updateStreak(user){
  const today = todayStr();
  if (!user.streak) user.streak = { count: 0, last: null };
  if (user.streak.last === today) return;
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestStr = yest.getFullYear()+"-"+String(yest.getMonth()+1).padStart(2,"0")+"-"+String(yest.getDate()).padStart(2,"0");
  if (user.streak.last === yestStr) user.streak.count += 1;
  else user.streak.count = 1;
  user.streak.last = today;
}

/* ---------------------------- Persistence (localStorage) ---------------------------- */

function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){}
  return fallback;
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ console.error("save failed", key, e); return false; }
}
function loadContent(){ return loadJSON("ee_content", { lessons: DEFAULT_LESSONS, quizzes: DEFAULT_QUIZZES }); }
function loadVocab(){ return loadJSON("ee_vocab", DEFAULT_VOCAB); }
function loadResults(){ return loadJSON("ee_results", {}); }
function saveContent(c){ return saveJSON("ee_content", c); }
function saveVocab(v){ return saveJSON("ee_vocab", v); }
function saveResults(r){ return saveJSON("ee_results", r); }

App.go = function(view, params){
  State.view = view; State.params = params || {};
  if (State.gameSession && State.gameSession.timerId) clearInterval(State.gameSession.timerId);
  if (view !== "games") { State.gameSession = null; State.gamesUI.playing = false; }
  if (view !== "quizTake") State.quizSession = null;
  render();

App.startQuiz = function(quizId){
  const quiz = State.content.quizzes.find(q => q.id === quizId);
  if (!quiz) return;
  const picked = sample(quiz.pool, quiz.pickCount || quiz.pool.length);
  const questions = picked.map(q => {
    if (q.type === "mc") return Object.assign({}, q, { choices: shuffle(q.choices) });
    if (q.type === "match") return Object.assign({}, q, { order: shuffle(q.pairs.map((_,i)=>i)) });
    return Object.assign({}, q);
  });
  const answers = {};
  questions.forEach(q => {
    if (q.type === "mc") answers[q.id] = null;
    else if (q.type === "fill") answers[q.id] = "";
    else if (q.type === "match") answers[q.id] = {};
  });
  const loggedUser = getLoggedInUser();
  State.quizSession = { quizId, studentName: loggedUser ? loggedUser.displayName : "", submitted: false, showKey: false, questions, answers, result: null };
  App.go("quizTake", { quizId });
};

App.pickChoice = function(qid, choiceB64){
  const choice = decodeURIComponent(escape(atob(choiceB64)));
  State.quizSession.answers[qid] = choice;
  render();
};
App.matchClick = function(qid, side, idx){
  const session = State.quizSession;
  const q = session.questions.find(x => x.id === qid);
  const pairing = session.answers[qid];
  if (side === "left") {
    if (pairing[idx] !== undefined) { delete pairing[idx]; session._selLeft = null; }
    else { session._selLeft = idx; }
  } else {
    const usedRight = Object.values(pairing);
    if (usedRight.includes(idx)) return;
    if (session._selLeft === undefined || session._selLeft === null) return;
    pairing[session._selLeft] = idx;
    session._selLeft = null;
  }
  render();
};
App.setQuizName = function(v){ State.quizSession.studentName = v; };
App.setFillAnswer = function(qid, v){ State.quizSession.answers[qid] = v; };

function scoreQuiz(session){
  let earned = 0, total = 0;
  session.questions.forEach(q => {
    if (q.type === "mc") { total += 1; if (session.answers[q.id] === q.correct) earned += 1; }
    else if (q.type === "fill") {
      total += 1;
      const val = (session.answers[q.id] || "").trim().toLowerCase();
      if (q.answers.some(a => a.toLowerCase() === val)) earned += 1;
    } else if (q.type === "match") {
      total += q.pairs.length;
      Object.entries(session.answers[q.id]).forEach(([li, ri]) => { if (Number(li) === Number(ri)) earned += 1; });
    }
  });
  return { earned, total };
}

App.submitQuiz = function(){
  const session = State.quizSession;
  const result = scoreQuiz(session);
  session.result = result; session.submitted = true;
  const quiz = State.content.quizzes.find(q => q.id === session.quizId);
  const lesson = State.content.lessons.find(l => l.id === quiz.lessonId);
  const category = lesson ? lesson.category : "อื่นๆ";
  if (session.studentName.trim()) {
    const list = State.results[quiz.id] || [];
    list.push({ name: session.studentName.trim(), score: result.earned, total: result.total, date: new Date().toISOString() });
    State.results[quiz.id] = list;
    persistResults();
  }
  const user = getLoggedInUser();
  if (user) {
    if (!user.quizHistory) user.quizHistory = [];
    user.quizHistory.push({ quizId: quiz.id, quizTitle: quiz.title, category, level: quiz.level, earned: result.earned, total: result.total, date: new Date().toISOString() });
    saveUser(user);
  }
  render();
  if (result.total > 0 && result.earned / result.total >= 0.6) confettiBurst(28);
};

function renderQuestionBlock(q, idx, session){
  let body = "";
  if (q.type === "mc") {
    body = `<div class="choice-list">${q.choices.map(c => `<button class="choice-btn ${session.answers[q.id]===c?"active":""}" onclick="App.pickChoice('${q.id}','${b64(c)}')">${esc(c)}</button>`).join("")}</div>`;
  } else if (q.type === "fill") {
    body = `<input class="fill-input" value="${esc(session.answers[q.id])}" oninput="App.setFillAnswer('${q.id}', this.value)" placeholder="พิมพ์คำตอบ">`;
  } else if (q.type === "match") {
    const pairing = session.answers[q.id];
    const usedRight = new Set(Object.values(pairing));
    body = `<div class="match-wrap">
      <div class="match-col">${q.pairs.map((p,li) => `<button class="match-item ${pairing[li]!==undefined?"done":""} ${session._selLeft===li?"sel":""}" onclick="App.matchClick('${q.id}','left',${li})">${esc(p.left)}</button>`).join("")}</div>
      <div class="match-col">${q.order.map(ri => `<button class="match-item ${usedRight.has(ri)?"done":""}" ${usedRight.has(ri)?"disabled":""} onclick="App.matchClick('${q.id}','right',${ri})">${esc(q.pairs[ri].right)}</button>`).join("")}</div>
    </div>`;
  }
  return `<div class="question-block"><p class="question-num">ข้อ ${idx+1}</p><p class="question-text">${esc(q.question)}</p>${body}</div>`;
}

function renderAnswerKey(session){
  let html = `<div class="answerkey-block"><h3 class="page-title" style="font-size:22px">📋 เฉลยละเอียด</h3>`;
  session.questions.forEach((q, idx) => {
    if (q.type === "mc") {
      const chosen = session.answers[q.id];
      const correct = chosen === q.correct;
      html += `<div class="answerkey-row ${correct?"ak-correct":"ak-wrong"}"><div class="ak-head"><span>${correct?"✅":"❌"}</span><p>ข้อ ${idx+1}: ${esc(q.question)}</p></div>
        <ul class="ak-choices">${q.choices.map(c => `<li class="${c===q.correct?"ak-choice-correct":(c===chosen?"ak-choice-wrong":"")}">${esc(c)}${c===q.correct?" ✓ คำตอบที่ถูกต้อง":(c===chosen?" ✗ คำตอบของคุณ":"")}</li>`).join("")}</ul>
        ${q.explanation?`<p class="ak-explain">${esc(q.explanation)}</p>`:""}</div>`;
    } else if (q.type === "fill") {
      const val = (session.answers[q.id]||"").trim().toLowerCase();
      const correct = q.answers.some(a=>a.toLowerCase()===val);
      html += `<div class="answerkey-row ${correct?"ak-correct":"ak-wrong"}"><div class="ak-head"><span>${correct?"✅":"❌"}</span><p>ข้อ ${idx+1}: ${esc(q.question)}</p></div>
        <p class="ak-fill-line">คำตอบที่ถูกต้อง: <b>${esc(q.answers.join(" / "))}</b></p>
        <p class="ak-fill-line">คำตอบของคุณ: <b>${esc(session.answers[q.id]||"(ไม่ได้ตอบ)")}</b></p>
        ${q.explanation?`<p class="ak-explain">${esc(q.explanation)}</p>`:""}</div>`;
    } else {
      const pairing = session.answers[q.id];
      const correctCount = q.pairs.filter((_,li)=>pairing[li]===li).length;
      html += `<div class="answerkey-row ${correctCount===q.pairs.length?"ak-correct":"ak-wrong"}"><div class="ak-head"><span>${correctCount===q.pairs.length?"✅":"❌"}</span><p>ข้อ ${idx+1}: ${esc(q.question)} (${correctCount}/${q.pairs.length} คู่)</p></div>
        <ul class="ak-choices">${q.pairs.map(p=>`<li class="ak-choice-correct">${esc(p.left)} = ${esc(p.right)}</li>`).join("")}</ul>
        ${q.explanation?`<p class="ak-explain">${esc(q.explanation)}</p>`:""}</div>`;
    }
  });
  html += `</div>`;
  return html;
}

function renderGamePlay(){

  if (g.type === "memory") return renderMemory(g);

/* --- Memory match --- */
function makeMemorySession(words){
  const pairsCount = Math.min(8, words.length);
  const picked = sample(words, pairsCount);
  const items = picked.flatMap(w => [
    { key: w.id+"-en", wordId: w.id, text: w.word },
    { key: w.id+"-th", wordId: w.id, text: w.meaning },
  ]);
  return { cards: shuffle(items).map(c => Object.assign({matched:false}, c)), flipped: [], moves: 0 };
}
function renderMemory(g){
  const matchedCount = g.cards.filter(c=>c.matched).length;
  const won = matchedCount === g.cards.length;
  return `<div class="game-top"><p>ตาที่เดิน: <b>${g.moves}</b> · จับคู่ได้ ${matchedCount/2}/${g.cards.length/2}</p><button class="btn-mini" onclick="App.exitGame()">← ออกจากเกม</button></div>
  ${won ? `<div class="result-card"><div style="font-size:36px">🏆</div><h2>เก่งมาก! จับคู่ครบแล้ว</h2><p class="result-score">${g.moves} ตา</p><button class="btn btn-primary" onclick="App.exitGame()">เล่นเกมอื่น</button></div>` :
  `<div class="memory-grid">${g.cards.map((c,idx) => {
    const shown = g.flipped.includes(idx) || c.matched;
    return `<button class="memory-card ${c.matched?"matched":""} ${shown?"flipped":""}" onclick="App.memoryFlip(${idx})">${shown?esc(c.text):"❓"}</button>`;
  }).join("")}</div>`}`;
}
App.memoryFlip = function(idx){
  const g = State.gameSession;
  if (g.flipped.includes(idx) || g.cards[idx].matched || g.flipped.length===2) return;
  g.flipped.push(idx);
  if (g.flipped.length === 2) {
    g.moves++;
    const [a,b] = g.flipped;
    if (g.cards[a].wordId === g.cards[b].wordId) {
      g.cards[a].matched = true; g.cards[b].matched = true; g.flipped = [];
      const matchedCount = g.cards.filter(c=>c.matched).length;
      if (matchedCount === g.cards.length) confettiBurst(20);
    } else {
      render();
      setTimeout(()=>{ g.flipped = []; render(); }, 800);
      return;
    }
  }
  render();
};

/* --- Word scramble --- */
function makeScrambleSession(words){
  const rounds = sample(words, Math.min(8, words.length));
  const session = { rounds, idx: 0, score: 0, input: "", feedback: null, scrambled: "" };
  session.scrambled = scrambleWord(rounds[0].word);
  return session;
}
function scrambleWord(word){
  if (word.replace(/[^a-zA-Z]/g,"").length < 2) return word;
  let s = word, tries = 0;
  while (s.toLowerCase() === word.toLowerCase() && tries < 12) { s = shuffle(word.split("")).join(""); tries++; }
  return s;
}
function renderScramble(g){
  if (g.idx >= g.rounds.length) return `<div class="result-card"><div style="font-size:36px">🏆</div><h2>จบเกมเรียงตัวอักษร</h2><p class="result-score">${g.score}/${g.rounds.length}</p><button class="btn btn-primary" onclick="App.exitGame()">เล่นเกมอื่น</button></div>`;
  const cur = g.rounds[g.idx];
  return `<div class="game-top"><p>ข้อ ${g.idx+1}/${g.rounds.length} · คะแนน ${g.score}</p><button class="btn-mini" onclick="App.exitGame()">← ออกจากเกม</button></div>
  <div class="scramble-box">
    <p class="scramble-letters">${esc(g.scrambled.toUpperCase())}</p>
    <p class="mini-hint">คำใบ้ (ความหมาย): ${esc(cur.meaning)} · คำอ่าน: ${esc(cur.read||"")}</p>
    <input class="fill-input" value="${esc(g.input)}" oninput="App.scrambleInput(this.value)" placeholder="พิมพ์คำตอบที่ถูกต้อง" ${g.feedback?"disabled":""} onkeydown="if(event.key==='Enter') App.scrambleCheck()">
    ${!g.feedback ? '<button class="btn btn-primary" style="margin-top:12px" onclick="App.scrambleCheck()">✅ ตรวจคำตอบ</button>' : `
    <div class="feedback-box ${g.feedback==="correct"?"fb-correct":"fb-wrong"}">${g.feedback==="correct"?"ถูกต้อง! 🎉":"ยังไม่ถูก คำตอบคือ: "+esc(cur.word)}
    <br><button class="btn btn-primary" style="margin-top:10px" onclick="App.scrambleNext()">ข้อถัดไป →</button></div>`}
  </div>`;
}
App.scrambleInput = function(v){ State.gameSession.input = v; };
App.scrambleCheck = function(){
  const g = State.gameSession; const cur = g.rounds[g.idx];
  const correct = g.input.trim().toLowerCase() === cur.word.toLowerCase();
  if (correct) { g.score++; confettiBurst(10); }
  g.feedback = correct ? "correct" : "wrong";
  render();
};
App.scrambleNext = function(){
  const g = State.gameSession;
  g.idx++; g.input = ""; g.feedback = null;
  if (g.idx < g.rounds.length) g.scrambled = scrambleWord(g.rounds[g.idx].word);
  render();
};

/* --- Speed match --- */
function makeSpeedSession(words){
  const roundCount = Math.min(10, words.length);
  const rounds = sample(words, roundCount).map(w => {
    const distractors = sample(words.filter(x=>x.id!==w.id), 3).map(x=>x.meaning);
    return { word: w, choices: shuffle([w.meaning, ...distractors]) };
  });
  const session = { rounds, idx: 0, score: 0, timeLeft: 8, locked: false, chosen: null, timerId: null };
  startSpeedTimer(session);
  return session;
}
function startSpeedTimer(g){
  if (g.timerId) clearInterval(g.timerId);
  g.timeLeft = 8; g.locked = false; g.chosen = null;
  g.timerId = setInterval(() => {
    g.timeLeft -= 1;
    // update only the timer bar/text directly — no full re-render, so nothing else on screen flashes
    const fill = document.getElementById("speed-timer-fill");
    const txt = document.getElementById("speed-timer-text");
    if (fill) fill.style.width = Math.max(0, (g.timeLeft/8)*100) + "%";
    if (txt) txt.textContent = Math.max(0, g.timeLeft) + "s";
    if (g.timeLeft <= 0) { clearInterval(g.timerId); g.locked = true; setTimeout(()=>App.speedNext(), 700); }
  }, 1000);
}
function renderSpeed(g){
  if (g.idx >= g.rounds.length) { if(g.timerId) clearInterval(g.timerId); return `<div class="result-card"><div style="font-size:36px">🏆</div><h2>จบเกมทายคำเร็ว</h2><p class="result-score">${g.score}/${g.rounds.length}</p><button class="btn btn-primary" onclick="App.exitGame()">เล่นเกมอื่น</button></div>`; }
  const round = g.rounds[g.idx];
  return `<div class="game-top"><p>ข้อ ${g.idx+1}/${g.rounds.length} · คะแนน ${g.score}</p><button class="btn-mini" onclick="App.exitGame()">← ออกจากเกม</button></div>
  <div class="timer-bar"><div class="timer-fill" id="speed-timer-fill" style="width:${(g.timeLeft/8)*100}%"></div></div>
  <p class="mini-hint" style="text-align:right;margin:4px 0 0" id="speed-timer-text">${g.timeLeft}s</p>
  <p class="question-text" style="font-size:26px;text-align:center;margin:16px 0">${esc(round.word.word)}</p>
  <p class="mini-hint" style="text-align:center;margin-bottom:10px">🔊 ${esc(round.word.read||"")}</p>
  <div class="choice-list">${round.choices.map(c => {
    const isRight = c === round.word.meaning;
    let cls = "";
    if (g.locked) { if (isRight) cls="active"; else if (c===g.chosen) cls="wrong-choice"; }
    return `<button class="choice-btn ${cls}" ${g.locked?"disabled":""} onclick="App.speedPick('${b64(c)}')">${esc(c)}</button>`;
  }).join("")}</div>`;
}
App.speedPick = function(choiceB64){
  const g = State.gameSession; if (g.locked) return;
  const choice = decodeURIComponent(escape(atob(choiceB64)));
  clearInterval(g.timerId);
  g.chosen = choice; g.locked = true;
  if (choice === g.rounds[g.idx].word.meaning) { g.score++; confettiBurst(8); }
  render();
  setTimeout(()=>App.speedNext(), 700);
};
App.speedNext = function(){
  const g = State.gameSession; g.idx++;
  if (g.idx < g.rounds.length) startSpeedTimer(g);
  render();
};

/* --- Hangman --- */
const ALPHABET = "abcdefghijklmnopqrstuvwxyz".split("");
function makeHangmanSession(words){
  const rounds = sample(words, Math.min(6, words.length));
  return { rounds, idx: 0, guessed: new Set(), wrongCount: 0, maxWrong: 6 };
}
function renderHangman(g){
  if (g.idx >= g.rounds.length) return `<div class="result-card"><div style="font-size:36px">🏆</div><h2>จบเกมทายตัวอักษร</h2><p class="mini-hint">เล่นครบ ${g.rounds.length} คำแล้ว</p><button class="btn btn-primary" onclick="App.exitGame()">เล่นเกมอื่น</button></div>`;
  const cur = g.rounds[g.idx];
  const letters = cur.word.toLowerCase().split("");
  const won = letters.every(l => !/[a-z]/.test(l) || g.guessed.has(l));
  const lost = g.wrongCount >= g.maxWrong;
  const over = won || lost;
  const faces = ["🙂","😐","😟","😧","😨","😱","💀"];
  return `<div class="game-top"><p>คำที่ ${g.idx+1}/${g.rounds.length} · ผิด ${g.wrongCount}/${g.maxWrong} ${faces[g.wrongCount]}</p><button class="btn-mini" onclick="App.exitGame()">← ออกจากเกม</button></div>
  <p class="mini-hint" style="text-align:center">คำใบ้ (ความหมาย): ${esc(cur.meaning)}</p>
  <p class="hangman-word">${letters.map(l => /[a-z]/.test(l) ? (g.guessed.has(l)||over ? l : "_") : l).join(" ")}</p>
  ${over ? `<p class="feedback-box ${won?"fb-correct":"fb-wrong"}" style="text-align:center">${won?"ถูกต้อง เก่งมาก! 🎉":"หมดโอกาสแล้ว คำตอบคือ: "+esc(cur.word)}</p>
  <button class="btn btn-primary" style="margin-top:14px" onclick="App.hangmanNext()">คำถัดไป →</button>` :
  `<div class="hangman-keyboard">${ALPHABET.map(l => `<button class="key-btn ${g.guessed.has(l)?(cur.word.toLowerCase().includes(l)?"correct":"wrong"):""}" ${g.guessed.has(l)?"disabled":""} onclick="App.hangmanGuess('${l}')">${l}</button>`).join("")}</div>`}`;
}
App.hangmanGuess = function(letter){
  const g = State.gameSession; const cur = g.rounds[g.idx];
  if (g.guessed.has(letter)) return;
  g.guessed.add(letter);
  if (!cur.word.toLowerCase().includes(letter)) g.wrongCount++;
  else { const letters = cur.word.toLowerCase().split(""); if (letters.every(l => !/[a-z]/.test(l) || g.guessed.has(l))) confettiBurst(14); }
  render();
};
App.hangmanNext = function(){
  const g = State.gameSession;
  g.idx++; g.guessed = new Set(); g.wrongCount = 0;
  render();
};

/* --- Flashcard review --- */
function makeFlashcardSession(words){
  return { queue: shuffle(words).map(w=>w.id), wordMap: Object.fromEntries(words.map(w=>[w.id,w])), flipped: false, known: 0, total: words.length };
}
function renderFlashcard(g){
  if (g.queue.length === 0) return `<div class="result-card"><div style="font-size:36px">🏆</div><h2>ทบทวนครบแล้ว!</h2><p class="result-score">${g.known}/${g.total}</p><p class="mini-hint">คำที่จำได้จากทั้งหมด</p><button class="btn btn-primary" onclick="App.exitGame()">เล่นเกมอื่น</button></div>`;
  const w = g.wordMap[g.queue[0]];
  return `<div class="game-top"><p>เหลือในกอง ${g.queue.length} · จำได้แล้ว ${g.known}</p><button class="btn-mini" onclick="App.exitGame()">← ออกจากเกม</button></div>
  <div class="flip-card" id="flashcard-wrap" onclick="App.flashcardToggle()">
    <div class="flip-inner ${g.flipped?"flipped":""}" id="flashcard-inner">
      <div class="flip-front">${esc(w.word)}<br><span class="mini-hint">🔊 ${esc(w.read||"")}</span></div>
      <div class="flip-back">${esc(w.meaning)}<br><span class="mini-hint" style="color:white;opacity:.8">${POS_LABEL[w.pos]||w.pos}</span></div>
    </div>
  </div>
  <p class="mini-hint" style="text-align:center;margin:10px 0">แตะการ์ดเพื่อพลิกดูความหมาย</p>
  <div class="hero-actions"><button class="btn btn-ghost" onclick="App.flashcardMark(false)">🔁 ยังไม่คล่อง</button><button class="btn btn-primary" onclick="App.flashcardMark(true)">✅ จำได้แล้ว</button></div>`;
}
App.flashcardToggle = function(){
  const g = State.gameSession; g.flipped = !g.flipped;
  const el = document.getElementById("flashcard-inner");
  if (el) el.classList.toggle("flipped", g.flipped);
};
App.flashcardMark = function(known){
  const g = State.gameSession;
  const id = g.queue.shift();
  if (known) { g.known++; confettiBurst(6); } else g.queue.push(id);
  g.flipped = false;
  render();
};

function renderQuizQuestionEditor(q, qi){
  const typeLabel = {mc:"ปรนัย",fill:"เติมคำ",match:"จับคู่"}[q.type];
  let body = `<input value="${esc(q.question)}" oninput="App.quizQField(${qi},'question',this.value)" placeholder="โจทย์คำถาม">`;
  if (q.type === "mc") {
    body += q.choices.map((c,ci) => `<div class="mc-row"><input type="radio" name="correct_${qi}" ${q.correct===c && c!==""?"checked":""} onclick="App.quizQSetCorrect(${qi},${ci})"><input value="${esc(c)}" oninput="App.quizQChoiceField(${qi},${ci},this.value); App.quizQMaybeUpdateCorrect(${qi},${ci},this.value)" placeholder="ตัวเลือก ${ci+1}"></div>`).join("");
    body += `<p class="mini-hint">เลือกวงกลมหน้าตัวเลือกที่ถูกต้อง (ปัจจุบัน: ${esc(q.correct||"ยังไม่ได้เลือก")})</p>`;
  } else if (q.type === "fill") {
    body += `<input value="${esc(q.answers[0]||"")}" oninput="App.quizQAnswerField(${qi},this.value)" placeholder="คำตอบที่ถูกต้อง">`;
  } else if (q.type === "match") {
    body += q.pairs.map((p,pi) => `<div class="mc-row">
      <input value="${esc(p.left)}" oninput="App.quizQPairField(${qi},${pi},'left',this.value)" placeholder="คำ (ซ้าย)">
      <input value="${esc(p.right)}" oninput="App.quizQPairField(${qi},${pi},'right',this.value)" placeholder="ความหมาย/คู่ (ขวา)">
      <button class="btn-mini btn-mini-danger" onclick="App.quizQRemovePair(${qi},${pi})">🗑️</button></div>`).join("");
    body += `<button class="btn-mini" onclick="App.quizQAddPair(${qi})">➕ เพิ่มคู่</button>`;
  }
  body += `<label style="margin-top:6px">คำอธิบายเฉลย (ไม่บังคับ)</label><textarea rows="2" oninput="App.quizQField(${qi},'explanation',this.value)" placeholder="อธิบายว่าทำไมคำตอบนี้ถูกต้อง">${esc(q.explanation||"")}</textarea>`;
  return `<div class="sub-card"><div class="index-card-top"><span class="stamp stamp-mustard">${typeLabel}</span><button class="btn-mini btn-mini-danger" onclick="App.removeQuizQuestion(${qi})">🗑️ ลบข้อนี้</button></div>${body}</div>`;
}
App.quizQMaybeUpdateCorrect = function(qi, ci, value){
  // if this choice text was the previously-correct one (or is the checked radio), keep correct in sync as user types
  const q = State.teacherUI.quizDraft.pool[qi];
  const radios = document.getElementsByName("correct_"+qi);
  if (radios[ci] && radios[ci].checked) q.correct = value;
};

App.runBulkImport = function(){
  const t = State.teacherUI;
  const lines = t.bulkText.split("\n").map(l=>l.trim()).filter(Boolean);
  const added = [];
  lines.forEach(line => {
    const parts = line.split(/[|\t]/).map(p=>p.trim());
    if (parts.length >= 2 && parts[0] && parts[1]) {
      added.push({ id: genId("v"), word: parts[0], meaning: parts[1], read: parts[2]||"", pos: (parts[3] && POS_LABEL[parts[3]]) ? parts[3] : "n", level: t.bulkLevel });
    }
  });
  if (added.length > 0) {
    State.vocab = State.vocab.concat(added);
    persistVocab();
    t.bulkMsg = `นำเข้าสำเร็จ ${added.length} คำ ในระดับ ${t.bulkLevel}`;
    t.bulkText = "";
    toast(`นำเข้า ${added.length} คำแล้ว 🎉`);
  } else {
    t.bulkMsg = "ไม่พบข้อมูลที่นำเข้าได้ ตรวจรูปแบบแต่ละบรรทัดอีกครั้ง (ใช้ | คั่น)";
  }
  render();
};

/* --- Results admin --- */
function renderResultsAdmin(){
  return `<div class="manage-list">${State.content.quizzes.map(q => {
    const entries = State.results[q.id] || [];
    return `<div class="sub-card"><p class="manage-title">${esc(q.title)}</p>
      ${entries.length===0 ? '<p class="mini-hint">ยังไม่มีนักเรียนทำแบบทดสอบนี้</p>' : `
      <table class="result-table"><thead><tr><th>ชื่อ</th><th>คะแนน</th><th>วันที่</th></tr></thead>
      <tbody>${entries.slice().reverse().map(e => `<tr><td>${esc(e.name)}</td><td>${e.score}/${e.total}</td><td>${new Date(e.date).toLocaleString("th-TH")}</td></tr>`).join("")}</tbody></table>`}
    </div>`;
  }).join("")}</div>`;
}

/* --- Data (export/import/reset) admin --- */
function renderDataAdmin(){
  return `<div class="form-card"><h3>💾 สำรอง / ย้ายข้อมูล</h3>
    <p class="mini-hint">ข้อมูลทั้งหมดเก็บอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น (localStorage) ไม่มีการซิงก์ข้ามเครื่องอัตโนมัติ
    ใช้ปุ่มด้านล่างเพื่อส่งออกเป็นไฟล์ แล้วนำไปนำเข้าในเบราว์เซอร์/อุปกรณ์อื่น เพื่อให้เห็นข้อมูลชุดเดียวกัน</p>
    <div class="hero-actions" style="margin-top:12px">
      <button class="btn btn-mint" onclick="App.exportData()">⬇️ ส่งออกข้อมูล (.json)</button>
      <label class="btn btn-lav" style="cursor:pointer">⬆️ นำเข้าข้อมูล<input type="file" accept="application/json" style="display:none" onchange="App.importData(this.files[0])"></label>
      <button class="btn btn-danger" onclick="App.resetAllData()">♻️ รีเซ็ตเป็นค่าเริ่มต้น</button>
    </div>
  </div>`;
}
App.exportData = function(){
  const payload = { content: State.content, vocab: State.vocab, results: State.results, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "english-explorer-data.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("ส่งออกไฟล์ข้อมูลแล้ว 💾");
};
App.importData = function(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm("นำเข้าข้อมูลนี้จะแทนที่ข้อมูลปัจจุบันทั้งหมดในเบราว์เซอร์นี้ ต้องการดำเนินการต่อหรือไม่?")) return;
      if (data.content) { State.content = data.content; persistContent(); }
      if (data.vocab) { State.vocab = data.vocab; persistVocab(); }
      if (data.results) { State.results = data.results; persistResults(); }
      render();
      toast("นำเข้าข้อมูลสำเร็จ 🎉");
    } catch (err) { alert("ไฟล์ไม่ถูกต้อง หรือไม่ใช่ไฟล์ที่ส่งออกจากระบบนี้"); }
  };
  reader.readAsText(file);
};
App.resetAllData = function(){
  if (!confirm("รีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้นใช่หรือไม่? ข้อมูลที่แก้ไขไว้ในเบราว์เซอร์นี้จะหายไป")) return;
  State.content = { lessons: DEFAULT_LESSONS, quizzes: DEFAULT_QUIZZES };
  State.vocab = DEFAULT_VOCAB;
  State.results = {};
  persistContent(); persistVocab(); persistResults();
  render(); toast("รีเซ็ตข้อมูลเรียบร้อยแล้ว");
};

/* ---------------------------- Accounts / Login / Streaks / Progress pie chart ---------------------------- */

function getLoggedInUser(){
  const uname = getCurrentUsername();
  if (!uname) return null;
  const users = loadUsers();
  return users.find(u => u.username === uname) || null;
}
function saveUser(updated){
  const users = loadUsers();
  const idx = users.findIndex(u => u.username === updated.username);
  if (idx >= 0) users[idx] = updated; else users.push(updated);
  saveUsers(users);
}

const AccountUI = { mode: "login", username:"", password:"", displayName:"", error:"" };

function renderAccount(){
  const user = getLoggedInUser();
  if (!user) return renderAuthForm();
  return renderAccountDashboard(user);
}

function renderAuthForm(){
  const a = AccountUI;
  return `<div class="page"><div class="auth-card">
    <div style="text-align:center;font-size:30px">👤</div>
    <h2>${a.mode==="login"?"เข้าสู่ระบบ":"สมัครสมาชิก"}</h2>
    <p class="sub">เก็บสถิติการเรียนและสตรีคประจำวันของคุณเอง (บันทึกในเบราว์เซอร์นี้)</p>
    <div class="auth-tabs">
      <button class="auth-tab ${a.mode==="login"?"active":""}" onclick="App.setAuthMode('login')">เข้าสู่ระบบ</button>
      <button class="auth-tab ${a.mode==="register"?"active":""}" onclick="App.setAuthMode('register')">สมัครใหม่</button>
    </div>
    ${a.mode==="register" ? `<label class="mini-hint">ชื่อที่แสดง</label><input value="${esc(a.displayName)}" oninput="App.authField('displayName',this.value)" placeholder="เช่น น้องพลอย">` : ""}
    <label class="mini-hint">ชื่อผู้ใช้</label><input value="${esc(a.username)}" oninput="App.authField('username',this.value)" placeholder="username">
    <label class="mini-hint">รหัสผ่าน</label><input type="password" value="${esc(a.password)}" oninput="App.authField('password',this.value)" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter') App.submitAuth()">
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="App.submitAuth()">${a.mode==="login"?"🔓 เข้าสู่ระบบ":"✨ สมัครสมาชิก"}</button>
    ${a.error ? `<p class="auth-error">${esc(a.error)}</p>` : ""}
    <p class="gate-hint" style="text-align:center">บัญชีนี้เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ใช้เพื่อติดตามสถิติส่วนตัว ไม่ใช่ระบบความปลอดภัยขั้นสูง</p>
  </div></div>`;
}
App.setAuthMode = function(m){ AccountUI.mode = m; AccountUI.error=""; render(); };
App.authField = function(f,v){ AccountUI[f] = v; };
App.submitAuth = function(){
  const a = AccountUI;
  if (!a.username.trim() || !a.password.trim()) { a.error = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน"; render(); return; }
  const users = loadUsers();
  if (a.mode === "register") {
    if (users.some(u => u.username === a.username.trim())) { a.error = "มีชื่อผู้ใช้นี้แล้ว ลองชื่ออื่น"; render(); return; }
    const user = { username: a.username.trim(), password: a.password, displayName: a.displayName.trim() || a.username.trim(), streak: { count: 0, last: null }, quizHistory: [], createdAt: new Date().toISOString() };
    updateStreak(user);
    users.push(user); saveUsers(users);
    setCurrentUsername(user.username);
    toast(`ยินดีต้อนรับ ${user.displayName}! 🎉`);
  } else {
    const user = users.find(u => u.username === a.username.trim());
    if (!user || user.password !== a.password) { a.error = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"; render(); return; }
    updateStreak(user); saveUser(user);
    setCurrentUsername(user.username);
    toast(`ยินดีต้อนรับกลับมา ${user.displayName}! 🔥`);
  }
  a.username=""; a.password=""; a.displayName=""; a.error="";
  render();
};
App.logout = function(){ setCurrentUsername(null); render(); toast("ออกจากระบบแล้ว"); };

function buildPieGradient(segments){
  let acc = 0; const stops = [];
  segments.forEach(seg => {
    const start = acc, end = acc + seg.pct;
    stops.push(`${seg.color} ${start}% ${end}%`);
    acc = end;
  });
  if (acc < 100) stops.push(`#e5e0f0 ${acc}% 100%`);
  return `conic-gradient(${stops.join(",")})`;
}
function accuracyColor(pct){
  if (pct >= 75) return "#3fc79e";
  if (pct >= 50) return "#D9A62E";
  return "#FF7A7A";
}

function renderAccountDashboard(user){
  const history = user.quizHistory || [];
  const byCategory = {};
  history.forEach(h => {
    const key = h.category || "อื่นๆ";
    if (!byCategory[key]) byCategory[key] = { correct: 0, total: 0 };
    byCategory[key].correct += h.earned;
    byCategory[key].total += h.total;
  });
  const catKeys = Object.keys(byCategory);
  const totalQuestions = catKeys.reduce((s,k)=>s+byCategory[k].total, 0);
  const palette = ["#FF8FC7","#63C4FF","#63D9B7","#FFC94A","#B7A6FF","#FF7A7A"];
  const segments = catKeys.map((k,i) => ({ label:k, pct: totalQuestions? Math.round((byCategory[k].total/totalQuestions)*100):0, color: palette[i%palette.length], accuracy: byCategory[k].total? Math.round((byCategory[k].correct/byCategory[k].total)*100):0 }));

  const recent = history.slice().reverse().slice(0,8);

  return `<div class="page">
    <div class="account-header">
      <div class="account-avatar">🧑‍🎓</div>
      <div style="flex:1"><p class="account-name">${esc(user.displayName)}</p><p class="account-sub">@${esc(user.username)} · สมาชิกตั้งแต่ ${new Date(user.createdAt).toLocaleDateString("th-TH")}</p></div>
      <span class="streak-badge">🔥 ${user.streak?user.streak.count:0} วันติดต่อกัน</span>
      <button class="btn btn-ghost btn-sm" onclick="App.logout()">ออกจากระบบ</button>
    </div>

    <div class="section-block">
      <p class="section-kicker">🥧 ถนัดด้านไหน อ่อนด้านไหน</p>
      ${totalQuestions===0 ? `<p class="empty-note">ยังไม่มีข้อมูล ลองทำแบบทดสอบสักชุดก่อนนะ แล้วกลับมาดูกราฟตรงนี้ได้เลย!</p>` : `
      <div class="pie-wrap">
        <div class="pie-chart" style="background:${buildPieGradient(segments)}"></div>
        <div class="pie-legend">
          ${segments.map(s => `<div class="pie-legend-row">
            <span class="pie-dot" style="background:${s.color}"></span>
            <span class="pie-legend-label">${esc(s.label)}</span>
            <span class="pie-legend-pct">${s.pct}%</span>
          </div>
          <div class="strength-bar-track"><div class="strength-bar-fill" style="width:${s.accuracy}%;background:${accuracyColor(s.accuracy)}"></div></div>
          <p class="mini-hint" style="margin-top:-2px">ความแม่นยำ ${s.accuracy}% ${s.accuracy>=75?"— ถนัดมาก! 💪":s.accuracy>=50?"— กำลังไปได้ดี":"— ควรฝึกเพิ่ม 📖"}</p>
          `).join("")}
        </div>
      </div>`}
    </div>

    <div class="section-block">
      <p class="section-kicker">🕒 ประวัติการทำแบบทดสอบล่าสุด</p>
      ${recent.length===0 ? `<p class="empty-note">ยังไม่มีประวัติ</p>` : `<div class="manage-list">${recent.map(h => `
        <div class="manage-row"><div><p class="manage-title">${esc(h.quizTitle)}</p><p class="manage-sub">${esc(h.category||"")} · ${new Date(h.date).toLocaleString("th-TH")}</p></div><p class="manage-title">${h.earned}/${h.total}</p></div>`).join("")}</div>`}
    </div>
  </div>`;
}

/* ---------------------------- Bootstrap ---------------------------- */
initTheme();
{ const u = getLoggedInUser(); if (u) { updateStreak(u); saveUser(u); } }
render();
</script>
